schema:
  id: JH_AMDD_NARRATIVE_FLOW
  version: "1.0"
  status: CANONICAL_DERIVATIVE
  source_master: "JH_AMDD_master_v6_7_LOCKED"
  source_master_version: "6.7-resources-storage-pursuit-canonical"
  purpose: >
    Narrative flow layer between the master blueprint and technical level design.
    It defines mandatory story beats, authored player-facing options, allowed outcomes,
    fail-forward states, hard fails, and chapter-to-chapter continuity without defining
    exact geometry, encounter construction, clue placement, dialogue lines, or NPC staging.

design_contract:
  chronology_is_fixed: true
  chronology:
    - S0
    - K1
    - S1
    - K2
    - S2
    - K3
    - S3
    - K4
    - S4
    - K5
    - S5
    - K6
    - S6
    - K7
    - S7
    - K8
    - S8

  interpretation:
    forced_beat: "Must occur in every non-failed playthrough of the chapter."
    player_option: "Authored option already allowed by the master. Exact implementation is level design."
    fail_forward: "Bad or costly result that continues into later chronology."
    hard_fail: "Terminal run failure requiring reload/restart."
    optional_content: "May exist when its authored slot/conditions are active; never required for main progression."
    level_design_open: "Not canonical at this layer; authored later per level."

  global_rules:
    - "Master rules and persistent state remain authoritative."
    - "A real story branch still requires an explicit stable Variant ID in the master."
    - "Mandatory story content survives low ManuscriptFidelity."
    - "Distortion and Overdrive may alter expression or optional content, but do not invent new main-story topology."
    - "World memory survives reversion; consequences remain true after Jekyll/Hyde form changes."
    - "Voluntary serum use begins under player control."
    - "Voluntary Hyde loses control only at authored compulsion gates."
    - "Full spontaneous transformations and blackouts occur only at authored gates."
    - "K5 first spontaneous transformation cannot become a full blackout."
    - "K7 Carew crisis cannot become a full blackout."
    - "K6 and K8 may contain full blackouts."
    - "Suppressor is never mandatory for completing the main story."
    - "If an NPC death is an authored outcome here, later content must respect it."
    - "Additional killability of non-listed NPCs is decided in technical level design and must not contradict later forced beats."

  out_of_scope:
    - exact level geometry
    - exact NPC placement
    - patrol routes
    - exact clue locations
    - combat choreography
    - chase route geometry
    - exact dialogue lines
    - cinematic shot design
    - exact number of attackers or civilians
    - incidental NPC killability unless explicitly authored as a narrative outcome
    - exact shop layouts
    - exact stealth route construction

story:
  S0:
    title: STEVENSON_OPENING
    world: STEVENSON
    narrative_intent: >
      Establish Stevenson, Fanny, his illness, and the act of writing.
      The scene must end with Stevenson committing the first Jekyll chapter to the manuscript.
    forced_beats:
      - id: S0_ESTABLISH_STEVENSON
        event: "Stevenson is physically unwell but intends to work."
      - id: S0_FANNY_CONTACT
        event: "Fanny is present as the closest domestic counterweight to Stevenson's condition."
      - id: S0_BEGIN_MANUSCRIPT
        event: "Stevenson begins shaping the Jekyll story."
      - id: S0_WRITE_LOCK
        event: "The first manuscript chapter is written."
        motifs: [LÁTKA, PROMĚNA, BOLEST, ÚLEVA]
    player_options:
      medication_or_wait:
        - id: S0_WAIT_FANNY
          intent: "Wait for Fanny instead of self-medicating immediately."
        - id: S0_ANALGESIC
          intent: "Take fictional analgesic medication."
        - id: S0_STIMULANT
          intent: "Take fictional stimulant medication."
      Fanny_response:
        - id: S0_TRUTH
          intent: "Tell Fanny the truth about Stevenson's state."
        - id: S0_MINIMIZE
          intent: "Minimize how bad Stevenson's state is."
        - id: S0_HELP
          intent: "Ask Fanny for help."
    hard_fails: [STEVENSON_FATAL]
    exit_contract:
      next: K1
      required:
        - "Stevenson has committed to the first manuscript chapter."
        - "The first write lock has resolved."
    level_design_open:
      - "Exact domestic staging."
      - "Exact form and duration of the Fanny interaction."
      - "Exact medication presentation and physical interaction."
      - "Exact transition into manuscript space."

  K1:
    title: EXPERIMENT_AND_ROOK
    world: MANUSCRIPT
    narrative_intent: >
      Create Hyde, make the first transformation irreversible as a fact of Jekyll's life,
      kill Rook as a fixed story truth, lose the ledger, and start the police/underworld problem.
    forced_beats:
      - id: K1_JEKYLL_EXPERIMENT
        event: "Jekyll conducts the experiment as Jekyll."
      - id: K1_FIRST_TRANSFORMATION
        event: "The experiment causes the first transformation into Hyde."
      - id: K1_ROOK_CONFLICT
        event: "Hyde enters an immediate conflict involving Rook."
      - id: K1_ROOK_DIES
        event: "Rook dies after the immediate threat has ended."
        fixed_truth: true
      - id: K1_LEDGER_MISSING
        event: "Rook's ledger is missing after the incident."
        fixed_truth: true
      - id: K1_WORLD_REACTS
        event: "The death creates both police and underworld pressure."
      - id: K1_POLICE_SUMMONS
        event: "Newcomen summons Jekyll to the crime scene."
      - id: K1_ROOK_REPUTATION_REVEAL_AND_RELIEF
        event: "The story establishes Rook's reputation and the relief of his death."
      - id: K1_JEKYLL_INTERPRETS
        event: event:"After feeling relief, Jekyll must form an interpretation of what Hyde did and of his own reaction."
      - id: K1_TRANSFORMATION_KNOWLEDGE
        event: "Jekyll gains first-hand knowledge of transformation and post-transform physiology."
    player_options:
      brew_approach:
        - id: K1_PRECISE
          intent: "Prepare the first experiment precisely."
        - id: K1_FAST
          intent: "Use a faster fallback preparation."
        - id: K1_RISKY
          intent: "Use a deliberately risky preparation."
      Rook_resolution:
        - id: K1_CONTROLLED
          intent: "Resolve the Rook incident with the greatest available restraint."
        - id: K1_CHAOTIC
          intent: "Resolve the incident chaotically and leave a messier aftermath."
        - id: K1_BRUTAL
          intent: "Resolve the incident through overt brutality."
      Jekyll_interpretation:
        - id: K1_RESPONSIBILITY
          intent: "Accept responsibility for what happened."
        - id: K1_RATIONALIZE
          intent: "Rationalize the death on the basis that Rook was evil."
        - id: K1_SUPPRESS
          intent: "Refuse to think about the event."
    persistent_story_facts_on_successful_exit:
      - RookDead
      - LedgerMissing
      - "Police interest exists."
      - "Underworld interest exists."
      - "Crowther pressure has begun."
      - "Incident INC_K1_ROOK exists."
    hard_fails: [PLAYER_DEATH, DEFINITIVE_CAPTURE, SERUM_OVERDOSE]
    exit_contract:
      next: S1
      required:
        - "Rook is dead."
        - "The ledger is missing."
        - "Jekyll has survived and reverted from the first transformation."
        - "Jekyll has formed an authored interpretation of the event."
    level_design_open:
      - "Exact laboratory layout."
      - "Exact cause and choreography of the Rook confrontation."
      - "Exact physical manner of Rook's death."
      - "Exact mechanism by which the ledger goes missing."
      - "Exact combat, chase, or escape construction."

  S1:
    title: MOTIF_TUTORIAL_AND_HOUSE
    world: STEVENSON
    narrative_intent: >
      Return to Stevenson after the first Hyde chapter and establish that the manuscript
      feeds back into his physical and emotional life before he writes the police chapter.
    forced_beats:
      - id: S1_RETURN_TO_STEVENSON
        event: "The narrative returns from the manuscript to Stevenson."
      - id: S1_MANUSCRIPT_FEEDBACK
        event: "Themes from the first Jekyll chapter are available as material for Stevenson's next writing."
      - id: S1_FANNY_DOMESTIC_ANCHOR
        event: "Fanny and the domestic world remain available as Stevenson's real-world anchor."
      - id: S1_WRITE_NEXT
        event: "Stevenson continues the manuscript into K2."
    player_options:
      actions:
        - id: S1_BODY
          focus: [KREV, BOLEST, TĚLO]
        - id: S1_MEDICAL
          focus: [VĚDA, LÁTKA, ÚLEVA, ZÁVISLOST]
        - id: S1_FANNY
          focus: [PÉČE, DŮVĚRA, PODEZŘENÍ, VINA]
        - id: S1_FIRE
          focus: [KOUŘ, KLID, VZPOMÍNKA]
        - id: S1_WINDOW
          focus: [MLHA, SVĚTLO, SLEDOVÁNÍ]
        - id: S1_REST
          focus: [PÉČE, TĚLO, HLAD, ÚLEVA]
    hard_fails:
      - id: STEVENSON_FATAL
        possible_if: "Medication is used."
    exit_contract:
      next: K2
      required: ["Stevenson writes the next manuscript chapter."]
    level_design_open:
      - "Exact domestic activity order."
      - "Exact dialogue with Fanny."
      - "Exact manifestation of manuscript feedback."

  K2:
    title: ROOK_DEATH_INVESTIGATION
    world: MANUSCRIPT
    narrative_intent: >
      Force Jekyll to investigate Hyde's crime in public while protecting his own identity,
      establish Newcomen as the police pressure point, and turn the missing ledger into a lead
      toward Crowther's network.
    forced_beats:
      - id: K2_POLICE_CASE_ACTIVE
        event: "Rook's death is an active police investigation."
      - id: K2_JEKYLL_ENTERS_CASE
        event: "Jekyll participates in the first police investigation section as Jekyll."
      - id: K2_NO_TRANSFORMATION_DURING_FIRST_POLICE_SECTION
        event: "The first police section cannot be solved by transforming into Hyde."
        fixed_truth: true
      - id: K2_INVESTIGATE_OWN_CRIME
        event: "Jekyll investigates a crime actually committed by Hyde."
      - id: K2_MEET_NEWCOMEN
        event: "Jekyll meets and speaks with Newcomen."
      - id: K2_POLICE_KNOWLEDGE_REVEALED
        event: "The Newcomen interaction establishes what the police currently know and suspect."
      - id: K2_CROWTHER_DIRECTION_EMERGES
        event: "The investigation produces a direction toward the missing ledger and Crowther-linked people."
      - id: K2_AFTER_RELEASE_DECISION
        event: "After the official police section, Jekyll may prepare for further action or stop."
      - id: K2_AFTER_HOURS_RULE
        event: "If the player actively returns after hours, the playable return route is Hyde only."
        fixed_truth: true
      - id: K2_K3_POSITION_RESOLVES
        event: "The chapter resolves who has the initiative going into the intermediary hunt."
    player_options:
      day_investigation:
        - {id: K2_REASON, intent: "Reconstruct the crime through reasoning."}
        - {id: K2_CHEMISTRY, intent: "Examine the body or material evidence through Jekyll's expertise."}
        - {id: K2_SOCIETY, intent: "Use Jekyll's social access and status."}
        - {id: K2_LIE, intent: "Misdirect through a lie."}
        - {id: K2_TAMPER, intent: "Tamper with the investigation."}
      Newcomen_conversation:
        - {id: K2_GENERAL, intent: "Offer a general medical inference."}
        - {id: K2_SOCIAL, intent: "Control the conversation socially."}
        - {id: K2_LIE_DIALOGUE, intent: "Lie to Newcomen."}
        - {id: K2_EXACT, intent: "Offer an exact reconstruction that risks revealing too much knowledge."}
      after_release:
        - {id: K2_BREW, intent: "Brew serum after release."}
        - {id: K2_SKIP_BREW, intent: "Do not brew serum."}
      after_hours:
        - {id: K2_SKIP_AFTER_HOURS, intent: "Do not return after hours."}
        - {id: K2_HYDE_AFTER_HOURS, intent: "Return after hours as Hyde if serum is available."}
    possible_outcomes:
      initiative_state: [PLAYER_FIRST, CONTESTED, OTHERS_FIRST]
    optional_content:
      - {id: K2_COVER_SHOP, type: OPTIONAL_SLOT}
      - {id: K2_OVERDRIVE_WITNESS, type: AUTHORED_NOISE}
    preparation_options:
      after_release_only:
        - "Withdraw stored serum."
        - "Brew serum if current resources and lab access permit."
        - "Store excess legal doses."
        - "Requisition common reagents if still employed."
    hard_fails:
      - id: PLAYER_DEATH
        possible_during: HYDE_AFTER_HOURS_ONLY
      - DEFINITIVE_CAPTURE
      - id: SERUM_OVERDOSE
        possible_if: "Serum is used."
    exit_contract:
      next: S2
      required:
        - "The police investigation has happened."
        - "Jekyll has spoken with Newcomen."
        - "A Crowther-network direction exists."
        - "K3 initiative state is resolved."
    level_design_open:
      - "Exact crime-scene layout."
      - "Exact clues."
      - "Exact order in which investigation actions are discovered."
      - "Exact Newcomen dialogue."
      - "Exact after-hours route."
      - "Exact identity and placement of witnesses."
      - "Exact cover-shop implementation."

  S2:
    title: PREP_FOR_LEDGER
    world: STEVENSON
    narrative_intent: >
      Give Stevenson a preparation chapter before the intermediary hunt and establish
      secrecy, debt, doors, smoke, and fear as available dramatic material.
    forced_beats:
      - {id: S2_RETURN_TO_STEVENSON, event: "The story returns to Stevenson."}
      - {id: S2_PREPARE_NEXT_CHAPTER, event: "Stevenson prepares the manuscript chapter leading to Crowther's intermediary."}
      - {id: S2_WRITE_NEXT, event: "Stevenson writes K3."}
    player_options:
      actions:
        - {id: S2_REST, intent: "Rest."}
        - {id: S2_FOOD_FANNY, intent: "Eat / spend restorative time with Fanny."}
        - {id: S2_MEDICATE, intent: "Use medication."}
        - id: S2_INSPIRATION
          focus: [TAJEMSTVÍ, DLUH, DVEŘE, KOUŘ, STRACH]
        - {id: S2_PUSH, intent: "Push through fatigue to strengthen the writing."}
    hard_fails: [STEVENSON_FATAL]
    exit_contract:
      next: K3
      required: ["Stevenson writes the intermediary chapter."]
    level_design_open:
      - "Exact domestic staging."
      - "Exact Fanny interaction."
      - "Exact representation of inspiration."

  K3:
    title: LOST_LEDGER_AND_INTERMEDIARY
    world: MANUSCRIPT
    narrative_intent: >
      Move Jekyll into Crowther-linked criminal territory, force contact with the intermediary,
      allow the first major voluntary use of Hyde as a tool, and produce the next concrete
      lead toward Crowther and the witness.
    forced_beats:
      - {id: K3_FOLLOW_LEDGER_TRAIL, event: "Jekyll follows the missing-ledger trail into Crowther-linked territory."}
      - {id: K3_REACH_INTERMEDIARY, event: "The player reaches Crowther's intermediary."}
      - {id: K3_INTERMEDIARY_EXCHANGE, event: "The intermediary becomes the central source or obstacle for the next Crowther lead."}
      - {id: K3_PRIORITY_CONFLICT, event: "The chapter presents competing priorities around ledger, intermediary, and Hyde's escape."}
      - {id: K3_CROWTHER_LEAD_RESOLVES, event: "The chapter ends with usable direction deeper into Crowther's network."}
      - {id: K3_WITNESS_DIRECTION_EXISTS, event: "The story can progress toward Crowther's witness in K4."}
    player_options:
      form:
        - {id: K3_STAY_JEKYLL, intent: "Remain Jekyll."}
        - {id: K3_USE_SERUM, intent: "Voluntarily use Hyde."}
      Jekyll:
        - {id: K3_NEGOTIATE, intent: "Negotiate."}
        - {id: K3_KNOWLEDGE, intent: "Use existing knowledge."}
        - {id: K3_CHEMISTRY, intent: "Use scientific/chemical expertise."}
        - {id: K3_DEBT_TRAP, intent: "Create or exploit a debt/trap."}
      Hyde:
        - {id: K3_READ_FEAR, intent: "Read the intermediary's fear."}
        - {id: K3_PREDATORY_BARGAIN, intent: "Offer a predatory bargain."}
        - {id: K3_THREATEN, intent: "Threaten."}
      priority:
        - {id: K3_LEDGER, intent: "Prioritize the ledger."}
        - {id: K3_INTERMEDIARY, intent: "Prioritize the intermediary."}
        - {id: K3_HYDE_ESCAPE, intent: "Prioritize Hyde's escape."}
    possible_outcomes:
      - {id: LEAD, type: CONTINUE_WITH_ADVANTAGE}
      - {id: SHARED, type: CONTINUE_CONTESTED}
      - id: OTHERS
        type: FAIL_FORWARD
        meaning: "Opposition holds the initiative, but chronology continues."
    preparation_options:
      before_departure:
        - "Withdraw serum reserve."
        - "Brew serum."
        - "Collect carried reagents."
        - "Change outfit if the authored cover route is available."
    optional_content:
      - {id: K3_COVER_SHOP, type: OPTIONAL_SLOT}
      - {id: K3_OVERDRIVE_RUMOR, type: AUTHORED_NOISE}
      - id: K3_PICKPOCKET_BASE
        type: OPTIONAL_ROUTE
        possible_targets:
          ordinary_thief: [WALLET]
          informed_underworld_thief: [SERUM_DOSE, WALLET]
        resolution: [PICKPOCKET_SYSTEM, PURSUIT_SYSTEM]
    hard_fails: [PLAYER_DEATH, DEFINITIVE_CAPTURE, SERUM_OVERDOSE]
    exit_contract:
      next: S3
      required:
        - "The intermediary stage is resolved."
        - "A Crowther lead exists."
        - "The story can advance to the witness."
    level_design_open:
      - "Exact criminal district."
      - "Exact intermediary identity/presentation beyond canon already established elsewhere."
      - "Exact transaction or confrontation staging."
      - "Exact ledger location."
      - "Exact chase or escape route."
      - "Exact pickpocket staging."

  S3:
    title: FIRST_STRONG_BLEED
    world: STEVENSON
    narrative_intent: "Make the Stevenson/manuscript boundary visibly less stable before the witness chapter."
    forced_beats:
      - {id: S3_RETURN_TO_STEVENSON, event: "The narrative returns to Stevenson."}
      - {id: S3_BLEED_PRESENT, event: "The manuscript may now intrude more strongly into Stevenson's perception."}
      - {id: S3_WRITE_NEXT, event: "Stevenson continues into K4."}
    player_options:
      actions:
        - {id: S3_GROUND, intent: "Ground Stevenson and reconnect him to immediate reality."}
        - {id: S3_REST, intent: "Rest."}
        - {id: S3_MEDICATE, intent: "Use medication."}
        - {id: S3_PUSH, intent: "Push onward despite deterioration."}
    optional_content:
      - {id: S3_HALLUCINATION_MOTIFS, type: AUTHORED_PRESENTATION, enabled: true}
    hard_fails: [STEVENSON_FATAL]
    exit_contract:
      next: K4
      required: ["Stevenson writes the witness chapter."]
    level_design_open:
      - "Exact hallucination content."
      - "Exact domestic movement and staging."
      - "Exact Fanny participation."

  K4:
    title: CROWTHER_WITNESS
    world: MANUSCRIPT
    narrative_intent: >
      Put a living source of information about Crowther at risk, force a direct attack,
      and establish that a failed protection attempt can permanently change later content
      without stopping the main chronology.
    forced_beats:
      - {id: K4_FIND_WITNESS, event: "Jekyll reaches Crowther's witness."}
      - {id: K4_ACCESS_WITNESS_INFORMATION, event: "Jekyll gets an opportunity to establish what the witness knows."}
      - {id: K4_SECURE_WITNESS_ATTEMPT, event: "Jekyll attempts to secure, protect, or relocate the witness."}
      - id: K4_FORCED_ATTACK
        event: "An authored attack occurs."
        fixed_truth: true
      - {id: K4_PRIORITY_CRISIS, event: "During the attack, the player must navigate competing priorities."}
      - {id: K4_WITNESS_OUTCOME, event: "The witness state resolves before chapter exit."}
    player_options:
      form:
        - {id: K4_STAY_JEKYLL, intent: "Remain Jekyll."}
        - {id: K4_USE_SERUM, intent: "Use Hyde."}
        - note: "Jekyll is preferred, but Hyde is authored as a valid route."
      Jekyll:
        - {id: K4_TREAT, intent: "Treat the witness."}
        - {id: K4_REASSURE, intent: "Reassure the witness."}
        - {id: K4_VERIFY, intent: "Verify the witness's information."}
        - {id: K4_RELOCATE, intent: "Relocate the witness."}
      Hyde:
        - {id: K4_PROTECTIVE_MENACE, intent: "Protect through menace."}
        - {id: K4_READ_FEAR, intent: "Read fear."}
        - {id: K4_INTIMIDATE, intent: "Intimidate."}
      forced_attack_priority:
        - {id: K4_PROTECT, intent: "Prioritize protecting the witness."}
        - {id: K4_INFORMATION, intent: "Prioritize securing information."}
        - {id: K4_HYDE_CHASE, intent: "Prioritize chasing the opposition."}
    possible_outcomes:
      - {id: WITNESS_SAFE, type: CONTINUE, persistent: true}
      - {id: WITNESS_COMPROMISED, type: FAIL_FORWARD, persistent: true}
      - {id: WITNESS_DEAD, type: FAIL_FORWARD, persistent: true}
    optional_content:
      - {id: K4_COVER_SHOP, type: OPTIONAL_SLOT}
      - {id: K4_OVERDRIVE_PASSERBY, type: AUTHORED_NOISE}
      - id: K4_PICKPOCKET_OVERDRIVE
        type: AUTHORED_NOISE
        possible_target: [WALLET]
    hard_fails: [PLAYER_DEATH, DEFINITIVE_CAPTURE, SERUM_OVERDOSE]
    exit_contract:
      next: S4
      required:
        - "The forced attack has occurred."
        - "Witness state is SAFE, COMPROMISED, or DEAD."
        - "The story still has a path toward Crowther's wider network."
    level_design_open:
      - "Exact witness location."
      - "Exact attacker identity and number."
      - "Exact attack trigger."
      - "Exact combat/chase geometry."
      - "Exact information object or testimony delivery."
      - "Exact reason the witness becomes compromised."

  S4:
    title: SOCIAL_INSPIRATION
    world: STEVENSON
    narrative_intent: >
      Give Stevenson a non-medication domestic chapter before K5 and frame the next
      manuscript movement around care, memory, home, secrecy, fear, and freedom.
    forced_beats:
      - {id: S4_RETURN_TO_STEVENSON, event: "The narrative returns to Stevenson."}
      - {id: S4_NO_MEDICATION, event: "Medication is unavailable in this chapter.", fixed_truth: true}
      - {id: S4_WRITE_NEXT, event: "Stevenson continues into the Crowther social-network chapter."}
    player_options:
      actions:
        - {id: S4_FANNY, focus: [PÉČE, DŮVĚRA, PODEZŘENÍ]}
        - {id: S4_FLOWERS, focus: [KVĚTINY, VZPOMÍNKA]}
        - {id: S4_MUSIC, focus: [HUDBA, KLID]}
        - {id: S4_FIRE, focus: [SVĚTLO, DOMOV]}
        - {id: S4_FICTION, focus: [TAJEMSTVÍ, STRACH, SVOBODA]}
    hard_fails: []
    exit_contract:
      next: K5
      required: ["Stevenson writes K5."]
    level_design_open:
      - "Exact domestic activity."
      - "Exact Fanny dialogue."
      - "Exact representation of memory and inspiration."

  K5:
    title: CROWTHER_SOCIAL_NETWORK
    world: MANUSCRIPT
    narrative_intent: >
      Let Jekyll investigate the respectable/social side of Crowther's network,
      permit an optional private Hyde detour, and then force the first unavoidable
      spontaneous transformation without allowing a full blackout.
    forced_beats:
      - {id: K5_ENTER_SOCIAL_NETWORK, event: "Jekyll investigates people connected to Crowther's social network."}
      - {id: K5_PUBLIC_JEKYLL, event: "Public progression occurs as Jekyll.", fixed_truth: true}
      - {id: K5_PRIVATE_WINDOW_MAY_EXIST, event: "A private authored space may permit optional Hyde use."}
      - {id: K5_REVERT_BEFORE_PUBLIC_RETURN, event: "If Hyde is used privately, Jekyll must revert before returning to public progression.", fixed_truth: true}
      - {id: K5_FIRST_SPONTANEOUS, event: "The first mandatory spontaneous transformation occurs.", fixed_truth: true}
      - {id: K5_NO_FULL_BLACKOUT, event: "This first spontaneous transformation cannot become a full blackout.", fixed_truth: true}
      - {id: K5_RESPONSE_TO_SPONTANEOUS, event: "The player consciously responds to the loss of control."}
      - {id: K5_NEW_TRUTH, event: "By chapter end, it is established that Jekyll no longer fully controls when Hyde appears."}
    player_options:
      public_Jekyll:
        - {id: K5_SOCIETY, intent: "Use social skill and status."}
        - {id: K5_REASON, intent: "Use reasoning."}
        - {id: K5_CHEMISTRY, intent: "Use scientific/chemical expertise."}
      private_transform:
        - {id: K5_STAY_JEKYLL, intent: "Remain Jekyll and return to public progression."}
        - {id: K5_USE_SERUM, intent: "Take an optional private Hyde detour."}
      private_Hyde:
        - {id: K5_INSTINCT, intent: "Use Hyde's instinct."}
        - {id: K5_MOBILITY, intent: "Use Hyde's mobility."}
        - {id: K5_BRUTALITY, intent: "Use Hyde's brutality."}
