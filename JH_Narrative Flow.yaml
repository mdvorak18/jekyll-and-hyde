technical_level_design_handoff:
  rule: >
    Technical level design may invent routes, spaces, sub-objectives, local obstacles,
    incidental NPCs, combat setups, stealth setups, clue placement, chase geometry,
    and exact dialogue staging only if every forced beat, authored option, persistent
    outcome, hard-fail rule, and chapter exit contract above remains satisfiable.
  must_not_change:
    - fixed chronology
    - forced deaths or forced survivals explicitly authored above
    - K2 first police section as Jekyll
    - no Jekyll after-hours route in K2
    - K4 forced attack
    - K5 first mandatory spontaneous transformation
    - K5 no full blackout
    - K6/K8 blackout eligibility
    - K7 Carew initially meeting Jekyll
    - K7 no full blackout
    - K8 final identity gate
    - S8 first draft always burns
    - S8 clean sheet remains
  may_define_later:
    - exact path between forced beats
    - exact dialogue
    - exact NPC positions
    - exact combat/chase/stealth construction
    - exact incidental NPC survival rules
    - exact clue locations
    - exact environmental storytelling
    - exact local fail-forward implementation
