stevenson:
  raw_initial:
    Pain: 80
    Fever: 65
    Fatigue: 40
    Agitation: 25
    Sedation: 0
    SleepDebt: 20
    Bleed: 0
    Rebound: 0
    MedicationDependence: 0
    FannyBond: 85
    AnalgesicTolerance: 0
    StimulantTolerance: 0
  ChemicalInstability:
    formula: 'clamp(.35*Sedation + .25*Agitation + .20*Rebound + .10*AnalgesicTolerance + .10*StimulantTolerance)

      '
  AuthorCondition:
    formula: 'clamp(100 - .30*Pain - .20*Fever - .25*Fatigue - .15*SleepDebt - .10*ChemicalInstability)

      '
    buckets:
      CRITICAL:
      - 0
      - 33
      STRAINED:
      - 34
      - 66
      STABLE:
      - 67
      - 100
  AuthoringClarity:
    formula: 'clamp(100 - .25*Pain - .20*Fatigue - .25*Agitation - .20*Sedation - .20*Bleed + .10*FannyBond)

      '
    buckets:
      DISTORTED:
      - 0
      - 33
      FRAYED:
      - 34
      - 66
      CLEAR:
      - 67
      - 100
  Bleed_buckets:
    LOW:
    - 0
    - 33
    MID:
    - 34
    - 66
    HIGH:
    - 67
    - 100
  state_lifecycle:
    acute_effects:
      reset_at_S_entry:
        Sedation: 0
        HallucinationSuppression: 0
        StimulantActivation: 0
        ActivationFocusMod: 0
      clear_after_write_lock: true
    persistent:
    - Pain
    - Fever
    - Fatigue
    - Agitation
    - SleepDebt
    - Bleed
    - Rebound
    - MedicationDependence
    - AnalgesicTolerance
    - StimulantTolerance
    - FannyBond
    recovery_actions:
      SLEEP:
        clears_acute_effects:
        - Sedation
        - HallucinationSuppression
        - StimulantActivation
        - ActivationFocusMod
        may_reduce:
        - Fatigue
        - SleepDebt
        - Rebound
        - Agitation
        profiles:
          FULL_NIGHT_480:
            status: PLAYTEST_BASELINE
            duration_minutes: 480
            writes:
              Fatigue: -30
              SleepDebt: -20
              Rebound: -15
              Agitation: -20
            clamp: 0..100
            clears_acute_effects:
            - Sedation
            - HallucinationSuppression
            - StimulantActivation
            - ActivationFocusMod
            unchanged:
            - Pain
            - Fever
            - Bleed
            - MedicationDependence
            - AnalgesicTolerance
            - StimulantTolerance
            - FannyBond
            rule: Only the FULL_NIGHT_480 profile uses these exact values. Other authored sleep durations require
              their own profile; do not scale or retrofit silently.
      REST:
        may_reduce:
        - Fatigue
        - Agitation
        - Rebound
      CARE:
        may_reduce:
        - Fatigue
        - Agitation
        may_affect:
        - condition_context
  authored_time:
    status: PLAYTEST_BASELINE
    scope: Stevenson chapters explicitly opting into AUTHORED_CLOCK; S1 first. Does not change manuscript clocks
      or silently retrofit S0/S2+.
    mode: AUTHORED_CLOCK
    fatigue_per_awake_minute: 0.2
    rule: 'For each committed awake activity: advance authored minutes; Fatigue = clamp(Fatigue + 0.2 * minutes);
      then apply explicit activity effects and clamp. Keep fractions. No real-time timer.'
    zero_time:
    - menus
    - reading dialogue at player speed
    - motif confirmation
    - walking within house
    - pause
    - reload
    sleep_exception: Full sleep advances clock without awake fatigue; apply its recovery profile once.
    pain_rule: No passive Pain increase or automatic medicine wearing-off curve in this revision. Pain changes only
      through declared exertion, medicine and existing canonical effects.
    order_matters: true
    atomicity: Charge time and effects once on activity commit. Reload restores both clock and state; never recharge
      a completed activity.

medication:
  fictional_only: true
  game_drop_range:
  - 0
  - 20
  tolerance_decay: false
  symptomatic:
    status: TUNING
    any:
    - Pain >= 50
    - Fatigue >= 60
    - Rebound >= 20
  ANALGESIC_A:
    target: 6 + round(AnalgesicTolerance/20)
    precision: max(1, 3-floor(AnalgesicTolerance/35))
    classification:
      UNDER: error < -precision
      CORRECT: abs(error) <= precision
      OVER: error > precision AND error < precision+5
      CRITICAL_HIGH: error >= precision+5
    effects:
      UNDER:
        Pain: -10
        Sedation: 4
        AnalgesicTolerance: 2
        MedicationDependence: 1
        HallucinationSuppression: 5
      CORRECT:
        Pain: -25
        Sedation: 10
        AnalgesicTolerance: 5
        MedicationDependence: 2
        HallucinationSuppression: 20
      OVER:
        Pain: -30
        Sedation: 30
        Rebound: 5
        AnalgesicTolerance: 8
        MedicationDependence: 4
        HallucinationSuppression: 35
      CRITICAL_HIGH:
        Pain: -30
        Sedation: 45
        Rebound: 10
        AnalgesicTolerance: 12
        MedicationDependence: 6
        HallucinationSuppression: 45
  STIMULANT_S:
    target: 5 + round(StimulantTolerance/20)
    precision: max(1, 3-floor(StimulantTolerance/35))
    classification:
      UNDER: error < -precision
      CORRECT: abs(error) <= precision
      OVER: error > precision AND error < precision+5
      CRITICAL_HIGH: error >= precision+5
    effects:
      UNDER:
        Fatigue: -8
        Agitation: 4
        SleepDebt: 2
        StimulantTolerance: 2
        MedicationDependence: 1
        StimulantActivation: 20
        ActivationFocusMod: 2
      CORRECT:
        Fatigue: -20
        Agitation: 10
        SleepDebt: 5
        StimulantTolerance: 5
        MedicationDependence: 2
        StimulantActivation: 50
        ActivationFocusMod: 8
      OVER:
        Fatigue: -25
        Agitation: 25
        SleepDebt: 15
        Rebound: 5
        StimulantTolerance: 8
        MedicationDependence: 4
        StimulantActivation: 80
        ActivationFocusMod: 4
      CRITICAL_HIGH:
        Fatigue: -25
        Agitation: 40
        SleepDebt: 20
        Rebound: 10
        StimulantTolerance: 12
        MedicationDependence: 6
        StimulantActivation: 100
        ActivationFocusMod: -5
  skip_dependence:
    if_40_plus_and_symptomatic:
      Rebound: 5
      Agitation: 5
    if_70_plus_and_symptomatic:
      Rebound: 8
      AuthorConditionModifier: -5
  Fanny_assistance:
    SUPPORTIVE: exact target ±1
    STRAINED: approximate
    WITHDRAWN: none
  emergency_if:
    any:
    - Sedation >= 90
    - Agitation >= 95
    - last_classification == CRITICAL_HIGH AND AuthorCondition < 25
  rescue_if: FannyPresent AND FannyBond >= 40
  rescue_writes:
    Fatigue: 15
    Bleed: 10
    FannyBond: -8
    NextWriteQualityModifier: -10
  fatal_handler: FAIL_STEVENSON_FATAL
  chapter_rules:
    S1:
      status: PLAYTEST_BASELINE
      availability: MORNING_FREE_ACTIONS only
      duration_minutes: 10
      allowed:
      - ANALGESIC_A
      - STIMULANT_S
      limit: One actual administration of each medication in S1 (maximum two); at least 60 authored minutes between
        any two S1 administrations. Inspecting bottles remains unlimited.
      dose: Use existing medication target, precision, classification, effect tables and emergency/rescue rules
        unchanged. Dose 0 cancels without time, effects or motif.
      cooldown: Measured between completed administrations; cannot pre-start a dose to bypass lock. No real-time
        waiting.
      automatic_motif: On actual positive-dose administration, acquire LATKA once per S1, Strength 50. A second
        type does not duplicate or strengthen it. No automatic PROMENA/ULEVA/ZAVISLOST.
      acute_lifecycle: New effects remain under existing lifecycle until writing; snapshot before clearing. No invented
        time-decay curve.
      fatal: Emergency -> rescue_if/rescue_writes if valid; otherwise FAIL_STEVENSON_FATAL. Surviving rescue keeps
        actual dose and LATKA; fatal attempt exports nothing.
      forced_dependence: No new dependency-forced motif rule in S1. LATKA is an explicit consequence of voluntary
        dosing, not an addiction-threshold intrusion.

author_packet:

  generated_at_each_write_lock: true

  fields:

    CognitiveImprint: AuthoringClarity

    ConditionImprint: AuthorCondition

    BleedImprint: Bleed

    ChemicalImprint: ChemicalInstability

    MotifPacket: selected_motifs

  CognitionBand:

    IMPAIRED:

      condition: CognitiveImprint <= 33

      JekyllCognitionMod: -10

      JekyllClueMod: -10

    STRAINED:

      condition: 34 <= CognitiveImprint <= 66

      JekyllCognitionMod: 0

      JekyllClueMod: 0

    LUCID:

      condition: CognitiveImprint >= 67

      JekyllCognitionMod: 10

      JekyllClueMod: 10

  ManuscriptFidelity:

    status: TUNING

    meaning: how complete, usable and detailed the written world is

    formula: clamp(.60*AuthoringClarity + .30*AuthorCondition + ActivationFocusMod)

    buckets:

      FRAGMENTARY:

      - 0

      - 39

      THIN:

      - 40

      - 69

      RICH:

      - 70

      - 100

  ManuscriptDistortion:

    status: TUNING

    meaning: how warped, uncanny and dreamlike the authored material is

    formula: clamp(.45*Bleed + .25*Fever + .20*Agitation + .10*ChemicalInstability)

    buckets:

      GROUNDED:

      - 0

      - 34

      UNEASY:

      - 35

      - 69

      NIGHTMARE:

      - 70

      - 100

  ManuscriptOverdrive:

    status: TUNING

    meaning: how excessive, hyperactive and overwritten the authored material is

    formula: clamp(.55*StimulantActivation + .35*Agitation - .30*Sedation)

    buckets:

      CALM:

      - 0

      - 34

      BUSY:

      - 35

      - 69

      OVERWRITTEN:

      - 70

      - 100

authorial_content:

  criticality:

    MANDATORY:

      affected_by_fidelity: false

    OPTIONAL_ROUTE:

      affected_by_fidelity: true

    FLAVOR:

      affected_by_fidelity: true

    NOISE:

      activated_by_overdrive: true

  fidelity:

    RICH:

      OPTIONAL_ROUTE: FULL

      FLAVOR: FULL

    THIN:

      OPTIONAL_ROUTE: LIMITED

      FLAVOR: REDUCED

    FRAGMENTARY:

      OPTIONAL_ROUTE: ABSENT_UNLESS_MINIMUM_VARIANT

      FLAVOR: MINIMAL

  overdrive:

    CALM:

      noise_slots: 0

    BUSY:

      noise_slots: 1

    OVERWRITTEN:

      noise_slots: 2

  distortion:

    GROUNDED: ordinary authored variant

    UNEASY: uncanny authored variant

    NIGHTMARE: strong warped authored variant

  clue_types:

    "TRUE": relevant factual clue
    AMBIGUOUS: real but open to interpretation

    AUTHORIAL_NOISE: plausible but nonessential authored clutter

  invariants:

  - mandatory content is never removed

  - noise comes only from declared NOISE slots

  - noise never hides mandatory truth behind RNG

  - no render stat creates a new quest by itself

  cover_shop_template:

    SlotID: SLOT_COVER_SHOP

    criticality: OPTIONAL_ROUTE

    RICH:

      VariantID: COVER_SHOP_FULL

      options:

      - BUY_NEW_COAT

      - ASK_FOR_REPAIR

      - REMOVE_MONOGRAM

      - HYDE_STEAL_COAT

      - HYDE_INTIMIDATE_SHOPKEEPER

    THIN:

      VariantID: COVER_SHOP_LIMITED

      options:

      - BUY_SIMPLE_COAT

      - HYDE_STEAL_COAT

    FRAGMENTARY:

      VariantID: COVER_SHOP_ABSENT

      description: shop is only a facade / closed / swallowed by fog

author_weather:

  status: TUNING

  generated_at_write_lock: true

  stored_in_AuthorPacket: true

  channels:

    Fog: clamp(.55*Sedation + .20*Fatigue + .15*Bleed + .10*SleepDebt)

    Storm: clamp(.45*Fever + .30*Agitation + .15*Bleed + .10*ChemicalInstability)

    Brightness: clamp(35 + .55*StimulantActivation + .15*AuthoringClarity - .35*Sedation - .15*Bleed)

    Wind: clamp(.45*Agitation + .30*StimulantActivation + .15*Fever + .10*Bleed)

    Rain: clamp(.35*Fever + .25*Pain + .25*Agitation + .15*Bleed)

    Gloom: clamp(.45*Fatigue + .30*Sedation + .25*Bleed)

    Unnaturalness: clamp(.55*Bleed + .25*ManuscriptDistortion + .20*ChemicalInstability)

  baseline_blend: FinalChannel = .50*ChapterBaselineChannel + .50*AuthorWeatherChannel

  visual_language:

    high_Sedation:

    - heavy fog

    - muffled sound

    - soft lamps

    - emptier streets

    high_Fever:

    - storm

    - rain

    - oppressive wet air

    high_Fatigue:

    - long dusk

    - weak lamps

    - muted skyline

    high_Agitation:

    - hard wind

    - fast clouds

    - flickering light

    productive_StimulantActivation:

    - clearer sky

    - sharp daylight

    - high definition

    - busier street life

    excessive_StimulantActivation:

    - overbright sky

    - hard shadows

    - nervous crowds

    - rapid weather movement

    high_Bleed:

    - fog indoors

    - rain under clear sky

    - impossible shadows

    - weather behaving wrongly

  context_mods:

    HEAVY_FOG:

      condition: FinalFog >= 70

      JekyllLongDistanceObservation: -5

      HydeDetectionByNPC: -5

    HEAVY_RAIN:

      condition: FinalRain >= 70

      BloodEvidencePersistence: -10

      FootprintVisibility: 10

    BRIGHT:

      condition: FinalBrightness >= 70

      WitnessDescriptionQuality: 10

      HydeStealth: -5

    STRONG_WIND:

      condition: FinalWind >= 70

      RooftopMobility: -5

      AmbientNoiseCover: 5

  branch_creation: false
form_visual_language:

  HYDE:

    mode: CONSTRAINED_PREDATORY_PERCEPTION

    base_world:

      intent: near-monochrome or duotone perception with strongly reduced ordinary color

      exact_palette: TBD_VISUAL_DIRECTION

      readability_rule: >
        Environment silhouettes, navigation, combat readability and mandatory information
        must remain clear.

    semantic_accents:

      RED:

        intent: violence / blood / immediate physical threat

        eligibility: AUTHORED_TAG_ONLY

        tag: HYDE_ACCENT_RED

      GOLD:

        intent: authored instinct-relevant object, target or cue

        eligibility: AUTHORED_TAG_ONLY

        tag: HYDE_ACCENT_GOLD

    tagging_rule: >
      Accent color is never inferred from generic interactability.
      Only explicitly authored/tagged objects or states may receive a semantic accent.
      A colored accent does not by itself create an interaction, clue, objective or branch.

    render_order:

    - resolve AuthorWeather / ManuscriptFidelity / ManuscriptDistortion / ManuscriptOverdrive

    - render underlying manuscript scene

    - if Form == HYDE, apply Hyde base perception treatment

    - apply eligible semantic accent tags without changing their meaning

    Stevenson_interaction:

      AuthorWeather: >
        Continues to affect the underlying scene and atmosphere.

      ManuscriptFidelity: >
        May change authored optional detail density.
        It does not remove the Hyde perception layer while Form == HYDE.

      ManuscriptDistortion: >
        May warp authored expression beneath or within the Hyde layer,
        but must not redefine semantic accent meaning.

      ManuscriptOverdrive: >
        May activate only declared authored visual/noise content.
        It must not automatically color ordinary objects or create false gameplay affordances.

    accessibility:

      color_alone_is_never_required: true

      secondary_cue_required: true

      secondary_cues:

      - luminance

      - shape

      - outline

      - animation

      - audio

    invariants:

    - Hyde perception changes presentation, not story topology.

    - Accent semantics remain stable unless explicitly changed by the master.

    - Mandatory information never relies on hue alone.

    - Generic interactability never grants a Hyde accent.

    - Exact LUT, post-process, emissive, material and VFX values belong downstream.  
motifs:
  outcomes:
    FULFILLED: 100
    TWISTED: 80
    MISSED: 0
  anchor_weight: 1.5
  selection:
    base_count: 2
    optional_third_if: third.Strength >= second.Strength-10
    chapter_overrides:
      S1:
        mode: EXPLICIT_ACCEPT_ALL
        maximum_voluntary: 6
        maximum_total: 7
        automatic_motif: LATKA on actual S1 medication administration
        strength_ranking_selects: false
        tie_break: NONE; stable display order only
        scope: Other chapter selection rules unchanged.
  unselected_candidate: DISCARDED
  selected_unresolved_at_convergence: MISSED
  main_story_required: false
  multi_motif_action_allowed: true
  strength_usage_S1:
    range: 0..100
    default: 50
    science_magazine: 75
    automatic_LATKA: 50
    state_bonus: 0
    decay: 0
    purpose: Closure weight and authored emphasis, never acceptance gating or top-N selection. Outcome score is
      separate from strength.
    weight: Strength / 50; anchor_weight 1.5 only for an explicitly designated anchor. S1 designates no weighted
      anchor.
collectibles:
  lead_soldiers:
    total: 16
    state:
      FoundStevensonSoldiers: {type: SET, initial: []}
      StevensonSoldiersFoundCount: {derived_from: FoundStevensonSoldiers, range: 0_TO_16}
      LeadSoldierShelfSeen: {type: BOOLEAN, initial: false}
      LeadSoldierQuestAccepted: {type: BOOLEAN, initial: false}
      LeadSoldierCollectionComplete: {derived_from: StevensonSoldiersFoundCount == 16}
    rules:
    - Collecting a soldier adds no HydeDependence; the kills and actions that create soldiers apply their normal consequences.
    - No soldier may be permanently lost; every slot declares a recovery route.
    - Completion gives no stat, skill or money reward; it unlocks the late authored confrontation.
    slots:
