invariants:

- K2 first police scene is always Jekyll, SerumStock 0, TransformWindow CLOSED.

- K2 has no Jekyll after-hours route.

- Voluntary serum use starts under player control.

- Voluntary Hyde can lose control only at authored COMPULSION_GATES.

- Full spontaneous transforms and blackouts occur only at authored gates.

- K5 first spontaneous transform cannot become a full blackout.

- K7 Carew crisis cannot become a full blackout.

- K6 and K8 may contain full blackouts.

- Suppressor reduces breakthrough pressure but does not satisfy Craving.

- Planned Hyde release may reduce Craving and buy CalmBeats while increasing Dependence.

- Hyde and Jekyll are visually treated as different men.

- World memory survives reversion.

- Newspapers contain only public facts and may prepare Jekyll for later dialogue.

- Player-secret knowledge is not automatically Jekyll-legitimate knowledge.

- ProfessionalStanding is separate from Society skill.

- Losing the professional lab is fail-forward; home lab remains.

- Motifs are optional dramatic opportunities, not mandatory quest checkboxes.

- One Hyde action may realize several motifs.

- Mandatory story content is never removed by low ManuscriptFidelity.

- Low Fidelity may remove/simplify declared optional shops, routes, clues and interactables.

- High Overdrive may add declared authored noise, false leads and excessive detail.

- Distortion changes authored expression without inventing new main-story topology.

- Correct stimulant use can improve writing quality; excess stimulation can create Overdrive/noise.

- Sedation can suppress hallucination pressure while reducing clarity and optional world detail.

- Fever/Agitation tend toward storms; Sedation toward fog; stimulant activation toward brightness.

- High Bleed may make weather and space behave unnaturally.

- Weather only adds presentation and declared small ContextMods.

- All manuscript effects of Stevenson state pass through AuthorPacket.

- No stat or formula creates an un-authored chapter or ending.

- There is no numeric money stat.

- 'Routine purchasing is access-based: employment + wallet + authored shop.'

- A stolen wallet temporarily blocks purchases; returning home can restore a wallet only while Jekyll remains funded/employed.

- Routine money cannot substitute for STABILIZER or special quest resources.

- Home lab can brew serum but never suppressor.

- Suppressor requires advanced equipment plus recipe knowledge, Chemistry and STABILIZER.

- Lanyon's lab may provide an advanced-equipment fail-forward route.

- Suppressor is never mandatory for completing the main story.

- Professional lab enables larger serum batches and larger reserves.

- Home lab serum batch is capped at SINGLE and reserve at 1.

- Carried serum begins at 1 dose and may rise to 2 through recipe mastery / case improvement.

- Larger simultaneous professional serum batches gain Potency but initially incur a Purity penalty.

- Recipe mastery comes from successful brewing plus Chemistry/Research, not from money or grind.

- At most one recipe mastery credit is awarded per chapter.

- Pickpockets exist only through authored PICKPOCKET_SLOTs.

- Higher Overdrive may activate more declared pickpocket slots in eligible criminal/crowded spaces.

- Low Fidelity may reduce crowd/pickpocket slot count rather than spawning contradictory crowds.

- Ordinary pickpockets normally target the wallet; serum/evidence theft requires an informed authored thief or visible

  item.

- Critical quest items cannot be permanently lost without a guaranteed authored recovery/fallback.

- Jekyll can catch a thief without transforming, but through harder time-sensitive Reason/Society pursuit.

- 'Hyde has genuine physical pursuit advantages: speed, climbing, damage, obstacle breaking and PredatorSense.'

- PredatorSense tracks only authored fresh trails/targets and is not omniscient wall vision.

- Quick-action timers have accessibility settings including NO_TIMER.

- Missing a single quick action degrades chase state rather than automatically hard-failing the mission.

- A shop may be absent at low Fidelity; high Overdrive may instead add merchant friction/noise if the shop exists.

- Hyde stealing a coat is contextual, not irrationally preferable to Jekyll simply buying one.

economy_access:

  design_rule: There is no numeric money economy. Jekyll normally has sufficient ordinary purchasing power while

    professionally employed. Losing employment removes routine discretionary purchase access. Temporary theft of

    his wallet blocks purchases until he recovers it or returns home to obtain another wallet from the household

    safe.

  EmploymentState:

    EMPLOYED:

      condition: ProfessionalStanding >= 40 AND ProfessionalLabAccess == true

      RoutinePurchasingPower: AVAILABLE

    SUSPENDED_OR_DISMISSED:

      condition: ProfessionalStanding < 40 OR ProfessionalLabAccess == false due career loss

      RoutinePurchasingPower: UNAVAILABLE

  WalletStatus:

    PRESENT: ordinary purchases may be made if RoutinePurchasingPower is AVAILABLE

    STOLEN: ordinary purchases temporarily blocked

    AT_HOME: ordinary purchases blocked until wallet collected

  initial:

    WalletStatus: PRESENT

  HomeSafe:

    money_amount: ABSTRACT / NOT NUMERIC

    restore_wallet_if:

    - WalletStatus == STOLEN

    - EmploymentState == EMPLOYED

    - player returns to Jekyll home

    result: WalletStatus = PRESENT

    note: The stolen wallet may still physically exist in world memory, but restoring access does not require tracking

      pennies or bank balances.

  RoutinePurchase:

    requires:

    - EmploymentState == EMPLOYED

    - WalletStatus == PRESENT

    - relevant authored shop/service exists

    examples:

    - ordinary coat

    - basic laboratory consumables

    - food

    - routine medical supplies

  SpecialPurchase:

    rule: Rare or story-significant reagents are never solved by 'having enough money' alone. They require an authored

      supplier, requisition, relationship, theft, discovery or quest source.

  why_Hyde_might_steal_when_Jekyll_is_funded:

  - Hyde needs cover immediately and cannot safely revert first

  - shop refuses service to Hyde

  - shop is closed to normal customers

  - Jekyll purchasing the exact suspicious item would create identity evidence

  - wallet was stolen

  - authorial Overdrive creates an authored merchant-friction variant
  
  
reagent_system:

  fictional_only: true

  rule: >
    Reagents are abstract fictional resource categories. No real chemical recipe,
    concentration or medically actionable instructions are represented.

  categories:

    BASE_REAGENT:

      role: ordinary serum substrate

      rarity: COMMON

    CATALYST:

      role: required component of SERUM_BASE

      rarity: UNCOMMON

    STABILIZER:

      role: >
        Special reagent used to convert SERUM_BASE into SUPPRESSOR
        once Jekyll has discovered the suppressor principle.

      rarity: RARE

      routine_purchase: false

  ReagentInventory:

    representation: small integer tokens, not a broad crafting inventory

    carried_field_cap: 3

    critical_reagent_auto_storage: lab storage when returned to a valid lab

  professional_lab_stock:

    while_accessible:

      BASE_REAGENT: UNLIMITED

      CATALYST: UNLIMITED

      STABILIZER: AUTHORED_ONLY

  home_lab_stock:

    BASE_REAGENT:

      passive_cap: 2

      restock_source: POOLE

    CATALYST:

      passive_cap: 2

      restock_source: POOLE

    STABILIZER:

      passive_cap: 0

      restock_source: NONE

      acquisition: AUTHORED_ONLY

    Poole_restock:

      request_location: JEKYLL_HOME

      player_requested: true

      delivery: NEXT_MANUSCRIPT_DAY

      behavior: RESTORE_BASE_AND_CATALYST_TO_PASSIVE_CAP

      reload_does_not_advance_delivery: true

      leaving_and_reentering_home_does_not_advance_delivery: true

  softlock_rule: >
    Suppressor is powerful but never mandatory for main-story completion.
    If STABILIZER or advanced equipment is unavailable, planned release,
    restraint, escape or Integration remain authored alternatives.

serum_recipe_mastery:

  status: TUNING

  philosophy: Jekyll begins from a written formula. Repeated successful preparation plus Chemistry skill creates

    insight automatically; the player does not buy recipe perks with money.

  SuccessfulBrewCredits:

    initial: 0

    gain_rule: Gain at most 1 mastery credit per manuscript chapter for the first stable successful serum brew.

      Repeated reload/brew farming in the same chapter gives no extra credit.

    qualifying_brew: BrewScore >= 55 AND resulting batch is not immediately FATAL

  levels:

    SERUM_RECIPE_L1:

      initial: true

      requires: none

      unlocks:

      - SINGLE batch

      - CarriedSerumCap 1

      - ProfessionalSerumReserveCap 1

    SERUM_RECIPE_L2:

      requires:

      - Chemistry >= 2

      - SuccessfulBrewCredits >= 2

      unlocks:

      - DOUBLE batch in PROFESSIONAL lab

      - ProfessionalSerumReserveCap 2

      - better batch consistency

    SERUM_RECIPE_L3:

      requires:

      - Chemistry >= 3

      - SuccessfulBrewCredits >= 3

      - ResearchProgress >= 30

      unlocks:

      - TRIPLE batch in PROFESSIONAL lab

      - CarriedSerumCap 2 via improved serum case

      - ProfessionalSerumReserveCap 3

    SERUM_RECIPE_L4:

      requires:

      - Chemistry >= 4

      - SuccessfulBrewCredits >= 4

      - ResearchProgress >= 60

      unlocks:

      - REFINED_TRIPLE batch

      - ProfessionalSerumReserveCap 4

      - reduced large-batch Purity penalty

  automatic_unlock_rule: When requirements become true at a lab analysis point, Jekyll receives the recipe insight

    automatically.

serum_storage:

  no_grid_inventory: true

  initial:

    CarriedSerumCap: 1

    CarriedSuppressorCap: 1

    ProfessionalSerumReserveCap: 1

    HomeSerumReserveCap: 1

  derived_caps:

    SERUM_RECIPE_L1:

      CarriedSerumCap: 1

      ProfessionalSerumReserveCap: 1

    SERUM_RECIPE_L2:

      CarriedSerumCap: 1

      ProfessionalSerumReserveCap: 2

    SERUM_RECIPE_L3:

      CarriedSerumCap: 2

      ProfessionalSerumReserveCap: 3

    SERUM_RECIPE_L4:

      CarriedSerumCap: 2

      ProfessionalSerumReserveCap: 4

  home_caps:

    CarriedSerumCap: recipe-derived

    HomeSerumReserveCap: 1

    MaximumBatchScale: SINGLE

    SuppressorReserveCap: 0

  professional_caps:

    MaximumBatchScale: recipe-derived

    SuppressorReserveCap: 2

  storage_flow:

  - brew batch

  - fill carried serum slots if player chooses

  - store remaining legal doses in current lab reserve

  - prevent brew if no legal storage exists unless player explicitly discards/replaces a dose

  retrieve_reserve:

    requires: physical return to the lab that stores the dose

    mid_mission_auto_refill: false

  design_effect: Losing the professional lab does not end the game, but it sharply reduces Jekyll's ability to stockpile

    multiple doses, which makes late Hyde control and redose planning more difficult.

inventory_system:

  design_rule: No grid inventory and no encumbrance simulation. Track only items that materially affect serum control,

    cover, investigation or authored objectives.

  categories:

    WALLET:

      slot: false

      stateful: true

    SERUM_DOSE:

      slot: CarriedSerumCap

    SUPPRESSOR:

      slot: CarriedSuppressorCap

    FIELD_REAGENT:

      slot: ReagentInventory.carried_field_cap

    EVIDENCE:

      slot: authored evidence capacity; normally abstract

    OUTFIT:

      slot: current worn outfit + authored spare only

  critical_item_rule: A critical quest item may be stolen only if an immediate or later authored recovery/fallback

    route is guaranteed.

  lab_storage_is_separate_from_carried_inventory: true

pickpocket_system:

  purpose: Criminal districts can threaten Jekyll's temporary access to money, serum, suppressor, reagents or evidence.

    Pickpockets are authored encounter slots, not random global procs.

  eligible_locations:

  - criminal streets

  - markets

  - crowded underworld interiors

  - selected K3/K6 spaces

  activation:

    base_rule: level must declare at least one PICKPOCKET_SLOT

    OverdriveBonus:

      CALM: 0

      BUSY: 1

      OVERWRITTEN: 2

    FidelityCap:

      RICH: all declared base + bonus slots may exist

      THIN: maximum 1 active pickpocket slot

      FRAGMENTARY: bonus slots disabled; only explicit mandatory/base slot may remain

    maximum_active_attempts_per_level: 3

  thief_types:

    ORDINARY_PICKPOCKET:

      default_targets:

      - WALLET

      can_target_serum: false

      can_target_evidence: false

    INFORMED_UNDERWORLD_THIEF:

      default_targets:

      - WALLET

      - SERUM_DOSE

      - SUPPRESSOR

      - FIELD_REAGENT

      - EVIDENCE

      rule: non-wallet targeting requires an authored reason the thief knows the item matters

  NoticePickpocketScore:

    JEKYLL: 40 + 10*Reason + ObservationContextMod + WeatherVisibilityMod

    HYDE: 40 + 12*Instinct + FearSensoryContextMod + WeatherVisibilityMod

    OUTCOMES:

      ANTICIPATE: Score >= 75; prevent theft or grab wrist before loss

      LATE_NOTICE: 55 <= Score <= 74; item taken, immediate pursuit starts

      MISSED: Score < 55; theft discovered after a short authored delay

  theft_priority_rule: Each authored slot declares TheftPriority. Ordinary thieves normally take WALLET. Serum/suppressor/evidence

    theft is reserved for informed thieves or visibly exposed items.

  wallet_theft:

    WRITES:

      WalletStatus: STOLEN

    purchase_access: blocked

    recovery:

    - catch thief

    - later recover from fence/cache if authored

    - return home and restore wallet from safe if still employed

  item_theft:

    WRITES:

    - remove selected carried item

    - create StolenItemCase

    possible_recovery:

    - immediate chase

    - Jekyll clue pursuit

    - Hyde physical pursuit

    - later underworld fence

    - authored informant

  fail_forward: Failure to recover an ordinary wallet or noncritical item does not end the story. Critical items

    require an authored fallback.

quick_action_system:

  status: TUNING

  purpose: Short reaction windows create pressure during thefts, escapes and investigations without turning the

    game into continuous QTEs.

  uses:

  - mark fleeing target

  - choose an intercept direction

  - spot a fresh clue before it is lost in crowd/weather

  - grab or dodge at close range

  - select a route during a chase

  default_window_seconds: 3.0

  accessibility:

    NORMAL: 1.0x timer

    EXTENDED: 2.0x timer

    NO_TIMER: decision remains but motor-time pressure is removed

    rule: Accessibility settings never remove story content or endings.

  failure_rule: Missing one quick action normally degrades the pursuit state; it does not instantly fail the entire

    mission.

pursuit_system:

  shared_states:

  - TARGET_VISIBLE

  - TARGET_LOST_IN_CROWD

  - TRAIL_FOUND

  - INTERCEPT_PREDICTED

  - TARGET_ESCAPED

  - TARGET_CAUGHT

  JEKYLL:

    fantasy: outthink the runner rather than overpower them

    strengths:

    - Reason identifies fresh clues

    - Reason predicts likely exits

    - Society can recruit a constable, shopkeeper or bystander if authored

    - knowledge of district can create intercept routes

    weaknesses:

    - lower sprint speed

    - slower climbing

    - cannot smash through many chase obstacles

    QuickReasonChain:

      examples:

      - notice direction of jostled crowd

      - spot dropped token or torn cloth

      - identify wet footprint before rain erases it

      - choose likely alley exit

      - question a bystander before memory becomes confused

      success_rule: normally 2 successful clue/intercept beats out of 3 before thief exits authored chase space

      Reason_effect: higher Reason extends clue legibility, improves clue ranking and may reveal an intercept instead

        of requiring raw foot speed

      Society_effect: if a suitable NPC is present, Society may block an exit or point out the thief

    catch_without_Hyde: true

    difficulty: deliberately harder than Hyde physical pursuit

  HYDE:

    fantasy: predator pursuit

    physical_modifiers:

      SprintSpeedPercent: 15 + 5*Mobility

      ClimbSpeedPercent: 25 + 8*Mobility

      GapReachContextMod: 5*Mobility

      MeleeDamagePercent: 20 + 10*Brutality

      StaggerPowerContextMod: 8*Brutality

      status: TUNING

    Mobility_actions:

    - vault market stalls

    - climb drainpipes / ledges

    - cross rooftops

    - take vertical shortcuts

    - tackle fleeing target from movement

    Brutality_actions:

    - break obstructing doors

    - shove through hostile blockers

    - tackle / pin thief

    - intimidate accomplices

    PredatorSense:

      skill: Instinct

      tracks:

      - fresh footstep direction

      - breathing / footfall audio

      - fearful heartbeat-like audio cue at close authored range

      - sweat / blood / chemical scent trace

      - disturbed crowd or recently moved objects

      TrackRange: 8 + 4*Instinct game meters

      FreshTrailDurationSeconds: 5 + 2*Instinct

      status: TUNING

      limits:

      - does not identify arbitrary people through thick walls

      - does not reveal future route choices

      - works only on authored fresh trails / tagged targets

      - heavy rain may weaken scent while strengthening footprint clues

  outcomes:

    CAUGHT_CLEAN: recover item; minimal new incident

    CAUGHT_INTIMIDATED: recover item; witness/fear consequences

    CAUGHT_INJURED: recover item; violence incident

    TARGET_ESCAPED: item remains stolen; recovery/fallback may continue later

shop_state_system:

  rule: Shop existence primarily comes from Fidelity. Overdrive does not normally erase the shop; it may add an

    authored complication, contradiction or excessive merchant behavior.

  Fidelity:

    RICH: full shop/interior and normal service may exist

    THIN: limited stock / stall / restricted interaction

    FRAGMENTARY: optional shop may be absent or only a facade

  OverdriveComplication:

    CALM: no extra merchant complication

    BUSY: one optional friction/noise beat may activate

    OVERWRITTEN: strong authored friction variant may activate

  example_last_coat:

    SlotID: SHOP_FRICTION_LAST_COAT

    requires:

    - shop exists

    - ManuscriptOverdrive == OVERWRITTEN

    fiction: The merchant claims the desired coat is the last one and refuses to sell it for an over-specific, overwritten

      reason.

    JEKYLL_options:

    - 'Society: persuade'

    - 'Reason: identify a different usable garment'

    - leave and use another cover route

    HYDE_options_if_present:

    - steal

    - intimidate

    - assault

    mandatory_for_cover: false

