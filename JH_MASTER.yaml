    45: better duration/redose forecast

    60: improved serum purification and REFINED_TRIPLE path when recipe mastery also qualifies

    75: refined suppressor

    90: advanced control / Integration hooks

  fallback_rule: required mechanics always have a non-research story unlock
research_journal:

  purpose: >
    Persistent diegetic record of Jekyll's scientific knowledge, hypotheses,
    procedures and empirical observations.

  exact_prose: DOWNSTREAM_CONTENT

  rules:

  - The journal may explain known gameplay effects without exposing hidden formulas or exact numeric state unless explicitly unlocked.

  - Basic known medical information may be available from the start and does not require the player to have heard the same information in dialogue.

  - New authored discoveries update existing entries rather than creating a separate progression tree.

  - Authored discoveries, observations and hypotheses are recorded automatically when their source event resolves; opening or reading the journal is never required to commit that knowledge.

  - Reading an entry does not grant ResearchProgress. ResearchProgress and research tags are awarded only by their authored source events/resolvers.

  - The journal records knowledge; it does not create arbitrary crafting combinations.
  
  sections:

    SUBSTANCES:

      LAUDANUM:

        system_binding: ANALGESIC_A

        initial_state: BASIC_KNOWN

        known_from_start: true

        basic_gameplay_summary:

        - reduces Pain

        - increases Sedation

        - suppresses hallucination pressure

        - repeated use builds tolerance and dependence

        - excessive dosing increases adverse effects and rebound

        future_updates: AUTHORED

      COCAINE:

        system_binding: STIMULANT_S

        initial_state: BASIC_KNOWN

        known_from_start: true

        basic_gameplay_summary:

        - reduces Fatigue temporarily

        - increases Agitation

        - increases SleepDebt

        - can improve activation and focus

        - repeated use builds tolerance and dependence

        - excessive dosing increases instability and rebound

        future_updates: AUTHORED

      SERUM:

        initial_state: ACTIVE_RESEARCH

        known_from_start: true

        contents:

        - current preparation notes

        - experimental hypotheses

        - observed Potency / Purity behavior when learned

        - transformation observations

        - post-transform physiology

        - reversion observations

        updates_from: AUTHORED_SERUM_RESEARCH_EVENTS

      SUPPRESSOR:

        initial_state: UNKNOWN

        reveal_if: SuppressorRecipeKnown == true

        contents:

        - suppression theory

        - preparation notes once discovered

        - observed suppression response

        updates_from: AUTHORED_SUPPRESSOR_RESEARCH_EVENTS
