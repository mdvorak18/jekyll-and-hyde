project:
  id: jekyll_hyde_a_most_dreadful_dream
  title: 'Jekyll & Hyde: A Most Dreadful Dream'
  master_version: 6.8-s1-time-inspiration
  replaces: 6.7-resources-storage-pursuit-canonical
  expected_length_hours:
  - 6
  - 8
  core_rule: 'Stevenson creates conditions, themes and problems. The player decides how Jekyll or Hyde solves them.

    Results become manuscript state; manuscript state affects Stevenson; Stevenson state configures the next manuscript

    chapter.

    '
  branch_rule: A real story branch requires an explicit stable Variant ID.
  node_rule: 'YAML nodes are decision/consequence points, not complete scenes. Dialogue IDs are intents, not final

    line-by-line scripts. Free-roam, traversal, stealth, combat, exploration and long conversations can exist between

    nodes.

    '
  scope_note: 'Complete master systems/topology replacement. Level-specific geometry, exact NPC placement, individual

    shop layouts, chase routes, clue placement and combat encounter construction are authored later per level while

    obeying this master.'

tuning:

  rule: 'Numbers marked TUNING are balancing defaults, not immutable narrative canon.

    '

