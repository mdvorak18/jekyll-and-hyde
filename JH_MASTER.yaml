serum:

  SerumStock:

    initial: 0

    min: 0

    max: 2

  dose_sizes:

    SMALL: 0.75

    STANDARD: 1.0

    LARGE: 1.25

  brew:

    score: 40 + 12*Chemistry + 6*Reason + Lab.BrewContextMod + BrewContextMod

    STRONG:

      condition: score >= 75

      ProcessQuality: 10

      preferred_doses: 2

    COSTLY:

      condition: 55 <= score <= 74

      ProcessQuality: -5

      preferred_doses: 1

    FAILED:

      condition: score < 55

      preferred_doses: 0

    approaches:

      BALANCED:

        PotencyMod: 0

        PurityMod: 0

      PUSH_POTENCY:

        PotencyMod: 15

        PurityMod: -15

      PURIFY:

        PotencyMod: -10

        PurityMod: 15

      DESPERATE:

        PotencyMod: 20

        PurityMod: -35

        status: TUNING

    Potency: clamp(30 + 8*Chemistry + .25*IngredientPotency + .10*LabQuality + ApproachPotencyMod + BatchScalePotencyMod

      + ProcessQuality)

    Purity: clamp(25 + 8*Chemistry + .25*IngredientPurity + .15*LabQuality + Lab.PurityModifier + ApproachPurityMod

      + BatchScalePurityMod + ProcessQuality)

    batch_scale:

      SINGLE:

        requires: SERUM_RECIPE_L1

        valid_labs:

        - PROFESSIONAL

        - HOME

        doses_created: 1

        PotencyMod: 0

        PurityMod: 0

      DOUBLE:

        requires: SERUM_RECIPE_L2

        valid_labs:

        - PROFESSIONAL

        doses_created: 2

        PotencyMod: 6

        PurityMod: -4

        status: TUNING

      TRIPLE:

        requires: SERUM_RECIPE_L3

        valid_labs:

        - PROFESSIONAL

        doses_created: 3

        PotencyMod: 12

        PurityMod: -8

        status: TUNING

      REFINED_TRIPLE:

        requires: SERUM_RECIPE_L4

        valid_labs:

        - PROFESSIONAL

        doses_created: 3

        PotencyMod: 12

        PurityMod: -2

        status: TUNING

    batch_scale_rule: >
      Larger simultaneous professional batches become more potent as Jekyll masters the recipe,
      but early large batches are harder to purify. Home brewing never exceeds SINGLE.

    preparation_base:

      id: SERUM_BASE

      rule: >
        Every serum preparation begins with BASE_REAGENT + CATALYST.
        Batch scale determines the required quantity.

      player_facing_recipe: research_journal.sections.SUBSTANCES.SERUM

    resource_requirements:
      SINGLE:

      - BASE_REAGENT x1

      - CATALYST x1

      DOUBLE:

      - BASE_REAGENT x2

      - CATALYST x2

      TRIPLE:

      - BASE_REAGENT x3

      - CATALYST x3

      REFINED_TRIPLE:

      - BASE_REAGENT x3

      - CATALYST x3

  use:

    EffectiveDrive: Potency*DoseMultiplier*(1-.35*(SerumTolerance/100))

    TransformFuelGain: clamp(ceil(EffectiveDrive/35),1,4)

    ToxicityGain: DoseMultiplier*(.55*Potency + .80*(100-Purity))

    SerumToleranceGain: round(2 + Potency/25 + DoseSizeBonus + RedoseBonus)

    toxicity:

      STABLE: ActiveToxicLoad < 70

      UNSTABLE: 70 <= ActiveToxicLoad < 95

      CRITICAL: 95 <= ActiveToxicLoad < 115

      FATAL: ActiveToxicLoad >= 115

    fatal_handler: FAIL_SERUM_OVERDOSE

