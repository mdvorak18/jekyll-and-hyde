route_check:

  scope:
  - authored dialogue skill routes
  - authored investigation skill routes
  - authored interaction skill routes

  rule: >
    Unless a subsystem declares its own explicit Master-level resolver,
    every authored skill-gated route uses this resolver.
    Ordinary non-skill dialogue and interactions do not require a route check.

  formula: 40 + 12*Primary + 6*Secondary + ContextMod

  STRONG: Score >= 75

  COSTLY: 55 <= Score <= 74

  UNAVAILABLE: Score < 55

  ContextMod:
    rule: >
      ContextMod is situational and applies only when the authored context
      is relevant to the current route. It never permanently changes
      the character's skill rank.

    examples:
    - professional standing affecting a Society route
    - grooming/presentation affecting a Society route
    - laboratory quality affecting a Chemistry route
    - visibility or environmental conditions affecting an observation route

  reads_firewall: true

