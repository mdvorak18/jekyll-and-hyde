manuscript_time:

  ManuscriptDay:

    initial: 1

    type: INTEGER

  TimeOfDay:

    type: AUTHORED_STATE

    values:

    - MORNING

    - DAY

    - EVENING

    - NIGHT

  advancement:

    rule: >
      Manuscript time advances only at explicit authored story transitions.
      Free roam, reloads and waiting do not advance the day automatically.

    day_advance_event: ADVANCE_MANUSCRIPT_DAY

  invariants:

  - There is no real-time manuscript clock simulation.

  - The player cannot advance ManuscriptDay by waiting.

  - Reloading never advances manuscript time.

  - Leaving and re-entering a location never advances manuscript time by itself.

  - TimeOfDay is authored by the current chapter or sequence unless an explicit story event changes it.


